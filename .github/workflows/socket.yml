name: Socket
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  socket:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: SocketDev/action@v1.3.2
        with:
          mode: firewall-free
      - name: Install dependencies through firewall
        run: sfw pip install ruff
