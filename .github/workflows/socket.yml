name: Socket
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  socket:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: socketdev/socket-action@v3.5.0
        with:
          python: "3.11"
